[project]
name = "rooftop-segmentation"
dynamic = ["version"]
description = "Rooftop segmentation research pipeline"
readme = "README.md"
requires-python = ">=3.12"

authors=[
    {name = "Subhra Biswas"}
]

keywords = [
    "computer-vision",
    "segmentation",
    "deep-learning",
    "transfer-learning",
    "research"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research"
]

[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v -s -ra --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]

python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

markers = [
    "smoke: quick tests for critical features",
    "unit: tests for individual components",
    "integration: tests requiring external services",
    "slow: tests that take significant time",
]

[tool.pylint.main]
source-roots = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.pyright]
extraPaths = ["src"]